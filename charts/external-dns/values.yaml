external-dns:
  provider:
    name: aws
  extraVolumes:
    - name: aws-credentials
      secret:
        secretName: external-dns
  extraVolumeMounts:
    - name: aws-credentials
      mountPath: /.aws
      readOnly: true
  extraArgs:
    - --annotation-filter=external-dns.alpha.kubernetes.io/exclude notin (true)
  domainFilters: ["funderburg.uk"]
  sources:
    - ingress
  # Required since chart 1.23.0 (no default). upsert-only makes and updates
  # records but never deletes them. That was the old default. Use `sync` if
  # you want records deleted when their Ingress goes away.
  policy: upsert-only
  managedRecordTypes:
    - A
  resources:
    limits:
      cpu: 10m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  env:
    - name: AWS_DEFAULT_REGION
      value: eu-west-2
    - name: AWS_SHARED_CREDENTIALS_FILE
      value: /.aws/credentials
  logLevel: debug
