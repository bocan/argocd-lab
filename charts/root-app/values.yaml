# Values for the root "app of apps".
#
# Each entry under `apps` becomes one Argo CD Application, but only when
# `enabled: true`. To bring an app back, set `enabled: true`, push, and let
# root-app sync. To remove an app, set `enabled: false`. Argo CD then deletes
# the Application and (when `finalizer` is true) everything it deployed.

# Namespace where Argo CD watches for Application objects.
argocdNamespace: argocd
project: default
repoURL: https://github.com/bocan/argocd-lab.git
targetRevision: HEAD

# Defaults for every app. Any app entry can override any of these keys.
defaults:
  # Add resources-finalizer.argocd.argoproj.io, so deleting the Application
  # also deletes the resources it deployed.
  finalizer: true
  # Optional per app, no default: `namespaceLabels` sets labels on the
  # destination namespace through managedNamespaceMetadata.
  # Turn on automated sync. selfHeal and prune only apply when this is true.
  automated: true
  selfHeal: true
  prune: true
  syncOptions:
    - CreateNamespace=true
  retry: {}

apps:
  argo-cd:
    enabled: true
    path: charts/argo-cd
    namespace: argocd
    # Never cascade-delete Argo CD from inside Argo CD.
    finalizer: false

  # LoadBalancer IPs for bare metal. k3s runs with --disable servicelb.
  metallb:
    enabled: true
    path: charts/metallb
    namespace: metallb-system
    # The speaker needs host networking and NET_RAW.
    namespaceLabels:
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged

  # Controller name and namespace are both "sealed-secrets". Seal with:
  #   kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets
  sealed-secrets:
    enabled: true
    path: charts/sealed-secrets
    namespace: sealed-secrets

  # SealedSecrets for the other apps. They name their own namespaces, so this
  # Application has no destination namespace. Those namespaces come from the
  # apps that use them (CreateNamespace=true). The retry covers the first sync,
  # when a namespace may not exist yet.
  # Secrets for apps that are still off wait in directories/parked-secrets,
  # which no Application syncs. Seal them again with the new key first.
  all-secrets:
    enabled: true
    path: directories/all-secrets
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2

  # Route53 DNS-01 credentials: aws-access-key-id and aws-secret-access-key
  # from all-secrets.
  cert-manager:
    enabled: true
    path: charts/cert-manager
    namespace: cert-manager

  # Route53 credentials file: Secret external-dns from all-secrets, mounted
  # at /.aws/credentials.
  external-dns:
    enabled: true
    path: charts/external-dns
    namespace: external-dns

  descheduler:
    enabled: false
    path: charts/descheduler
    namespace: descheduler

  kube-prometheus-stack:
    enabled: false
    path: charts/kube-prometheus-stack
    namespace: monitoring
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  prometheus-extra:
    enabled: false
    path: directories/prometheus-extra
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2

  loki:
    enabled: false
    path: charts/loki
    namespace: monitoring

  postgresql:
    enabled: false
    path: charts/postgresql
    namespace: postgresql

  keycloak:
    enabled: false
    path: charts/keycloak
    namespace: keycloak
    selfHeal: false
    prune: false

  velero:
    enabled: false
    path: charts/velero
    namespace: velero
