apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  # No resources-finalizer here, on purpose. root-app manages itself, so a
  # finalizer makes its delete hang. It also means deleting root-app leaves
  # the child Applications in place. To remove an app, disable it in values.yaml.
spec:
  project: default
  source:
    repoURL: https://github.com/bocan/argocd-lab.git
    path: charts/root-app/
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
