apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    # The ClusterIssuer CRD comes from this same chart, so it does not exist
    # yet on the first sync. Skip the dry run and apply after the CRDs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: chris@funderburg.me
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      # A ClusterIssuer reads these Secrets from the cert-manager namespace.
      # They come from directories/all-secrets.
      - dns01:
          route53:
            accessKeyIDSecretRef:
              name: aws-access-key-id
              key: accessKeyId
            secretAccessKeySecretRef:
              name: aws-secret-access-key
              key: secretAccessKey
            region: eu-west-2
