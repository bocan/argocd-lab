cert-manager:
  crds:
    enabled: true

  # Resources for the cert-manager controller pod.
  #
  # requests is what the scheduler reserves. The pods idle near 1m, so 10m
  # is enough. A CPU limit is a hard cap: above it the kernel throttles the
  # pod. Keep the limits well above the requests, because some work comes in
  # bursts. At 10m the controller was throttled in 95% of CPU periods, and
  # making the ACME account key timed out ("context deadline exceeded").
  #
  # For more information, see [Resource Management for Pods and Containers](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).
  resources:
    limits:
      # RSA keys for the ACME account and for each certificate.
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 10m
      memory: 50Mi

  webhook:
    resources:
      limits:
        # A TLS handshake for each API call that it validates.
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi

  cainjector:
    resources:
      limits:
        # Fills its caches at start, then injects the webhook CA bundle.
        cpu: 100m
        memory: 100Mi
      requests:
        cpu: 10m
        memory: 50Mi
