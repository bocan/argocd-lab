{{- /*
Sync wave 1: Argo CD creates these after the controller (and its validating
webhook) is healthy. SkipDryRunOnMissingResource: the CRDs do not exist
before the first sync, so the dry run would fail.
*/ -}}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .Values.ipAddressPool.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  addresses:
    {{- toYaml (required "ipAddressPool.addresses is required" .Values.ipAddressPool.addresses) | nindent 4 }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .Values.ipAddressPool.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ipAddressPools:
    - {{ .Values.ipAddressPool.name }}
