{{- /*
Mount options for the controller when it deletes or archives a volume. See
the comment in storageclass.yaml. It holds no secret data, so it is a plain
Secret in git, not a SealedSecret. It must match the StorageClass
mountOptions, so both come from .Values.nfs.mountOptions.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: mount-options
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  mountOptions: {{ join "," .Values.nfs.mountOptions | quote }}
